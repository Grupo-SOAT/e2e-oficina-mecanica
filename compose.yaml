services:
  postgres:
    mem_limit: 384m
    memswap_limit: 384m
    image: postgres:16
    container_name: oficina-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    mem_limit: 768m
    memswap_limit: 768m
    image: confluentinc/cp-kafka:7.9.1
    container_name: oficina-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENERS: "CONTROLLER://kafka:29093,PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: "ciWo7IWazngRchmPES6q5A"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  dynamodb:
    mem_limit: 256m
    memswap_limit: 256m
    image: amazon/dynamodb-local:2.5.2
    container_name: oficina-dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    mem_limit: 96m
    memswap_limit: 96m
    image: axllent/mailpit:v1.27
    container_name: oficina-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  mercadopago:
    mem_limit: 256m
    memswap_limit: 256m
    image: wiremock/wiremock:3.13.1
    container_name: oficina-mercadopago
    ports:
      - "8089:8080"
    volumes:
      - ./infra/wiremock:/home/wiremock:ro

  dynamodb-init:
    mem_limit: 128m
    memswap_limit: 128m
    image: amazon/aws-cli:2.22.35
    container_name: oficina-dynamodb-init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        aws dynamodb create-table
        --endpoint-url http://dynamodb:8000
        --region us-east-1
        --table-name execution
        --attribute-definitions
        AttributeName=PK,AttributeType=S
        AttributeName=SK,AttributeType=S
        AttributeName=GSI1PK,AttributeType=S
        AttributeName=GSI1SK,AttributeType=S
        --key-schema
        AttributeName=PK,KeyType=HASH
        AttributeName=SK,KeyType=RANGE
        --provisioned-throughput ReadCapacityUnits=5,WriteCapacityUnits=5
        --global-secondary-indexes
        'IndexName=GSI1,KeySchema=[{AttributeName=GSI1PK,KeyType=HASH},{AttributeName=GSI1SK,KeyType=RANGE}],Projection={ProjectionType=ALL},ProvisionedThroughput={ReadCapacityUnits=5,WriteCapacityUnits=5}'
        || true
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      dynamodb:
        condition: service_healthy

  observability:
    mem_limit: 1g
    memswap_limit: 1g
    image: grafana/otel-lgtm:0.11.10
    container_name: oficina-observability
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
      - "9090:9090"
      - "3200:3200"
    volumes:
      - observability-data:/data
      - ./observability/grafana/provisioning/dashboards/oficina.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/oficina.yaml:ro
      - ./observability/grafana/provisioning/alerting/oficina.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/oficina.yaml:ro
      - ./observability/grafana/dashboards:/otel-lgtm/grafana-dashboards/oficina:ro

  mnl:
    mem_limit: 768m
    memswap_limit: 768m
    build:
      context: ../mnl-oficina-mecanica
      dockerfile: Dockerfile
    container_name: oficina-mnl
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar -Xms192m -Xmx384m"
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oficina_mnl
      SPRING_DATASOURCE_USERNAME: mnl
      SPRING_DATASOURCE_PASSWORD: mnl
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: local-dev-secret-key-for-testing-only
      DEFAULT_USER_PASSWORD: default123
      API_KEY_CHATBOT: local-chatbot-api-key
      INTERNAL_API_KEY: local-internal-key
      APP_BUDGET_KAFKA_ENABLED: "true"
      APP_SERVICE_ORDER_BASE_URL: http://ms-pedidos:8082
      OTEL_SERVICE_NAME: mnl-oficina-mecanica
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=oficina-mecanica
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      observability:
        condition: service_started

  ms-orcamentos:
    mem_limit: 448m
    memswap_limit: 448m
    build:
      context: ../ms-orcamentos
      dockerfile: Dockerfile
    container_name: oficina-ms-orcamentos
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar -Xms96m -Xmx192m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oficina_ms_orcamentos
      SPRING_DATASOURCE_USERNAME: ms_orcamentos
      SPRING_DATASOURCE_PASSWORD: ms_orcamentos
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      APP_BUDGET_BASE_URL: http://localhost:8080
      APP_MNL_BASE_URL: http://mnl:8080
      APP_SERVICE_ORDER_BASE_URL: http://ms-pedidos:8082
      APP_REGISTRATION_BASE_URL: http://mnl:8080
      APP_EVENTS_TOPIC_SERVICE_ORDER: service-order-events
      APP_EVENTS_TOPIC_BUDGET: budget-events
      APP_EVENTS_TOPIC_PAYMENT: payment-events
      SPRING_KAFKA_CONSUMER_GROUP_ID: ms-orcamentos-e2e
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: latest
      APP_MERCADOPAGO_BASE_URL: http://mercadopago:8080
      APP_MERCADOPAGO_ACCESS_TOKEN: local-token
      APP_PAYMENT_TIMEOUT_CHECK_MS: "2000"
      APP_INTERNAL_API_KEY: local-internal-key
      OTEL_SERVICE_NAME: ms-orcamentos
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=oficina-mecanica
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
      observability:
        condition: service_started

  ms-pedidos:
    mem_limit: 448m
    memswap_limit: 448m
    build:
      context: ../ms-pedidos
      dockerfile: Dockerfile
    container_name: oficina-ms-pedidos
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar -Xms96m -Xmx192m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oficina_ms_pedidos
      SPRING_DATASOURCE_USERNAME: ms_pedidos
      SPRING_DATASOURCE_PASSWORD: ms_pedidos
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_MNL_BASE_URL: http://mnl:8080
      APP_EVENTS_TOPIC_SERVICE_ORDER: service-order-events
      APP_EVENTS_TOPIC_BUDGET: budget-events
      APP_EVENTS_TOPIC_PAYMENT: payment-events
      APP_EVENTS_TOPIC_EXECUTION: execution-events
      APP_INTERNAL_API_KEY: local-internal-key
      SPRING_KAFKA_CONSUMER_GROUP_ID: ms-pedidos-e2e
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: latest
      OTEL_SERVICE_NAME: ms-pedidos
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=oficina-mecanica
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mnl:
        condition: service_started
      observability:
        condition: service_started

  ms-expedicao:
    mem_limit: 448m
    memswap_limit: 448m
    build:
      context: ../ms-expedicao
      dockerfile: Dockerfile
    container_name: oficina-ms-expedicao
    environment:
      JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar -Xms96m -Xmx192m"
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_TABLE: execution
      DYNAMODB_QUEUE_INDEX: GSI1
      AWS_REGION: us-east-1
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_EVENTS_TOPIC_SERVICE_ORDER: service-order-events
      APP_EVENTS_TOPIC_PAYMENT: payment-events
      APP_EVENTS_TOPIC_EXECUTION: execution-events
      SPRING_KAFKA_CONSUMER_GROUP_ID: ms-expedicao-e2e
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: latest
      OTEL_SERVICE_NAME: ms-expedicao
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4318
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=oficina-mecanica
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    ports:
      - "8083:8083"
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
      observability:
        condition: service_started

volumes:
  postgres-data:
  dynamodb-data:
  observability-data:
